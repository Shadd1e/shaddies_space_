
name: Import Automate-X course bank

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatex-course-bank-import
  cancel-in-progress: false

jobs:
  import-course-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out the deployed project source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: npm ci

      - name: Install course-bank extractor dependency
        run: python -m pip install -r requirements-course.txt

      - name: Extract and validate the course bank
        run: npm run automatex:extract

      - name: Import course bank into Supabase
        run: npm run automatex:load
